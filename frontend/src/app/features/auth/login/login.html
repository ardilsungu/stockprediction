<div class="auth-wrapper">
  <div class="auth-card">
    <h1 class="auth-title">Giriş Yap</h1>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-group">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="ornek@email.com"
          [class.invalid]="form.get('email')?.invalid && form.get('email')?.touched"
        />
        @if (form.get('email')?.invalid && form.get('email')?.touched) {
          <span class="field-error">Geçerli bir email girin.</span>
        }
      </div>

      <div class="form-group">
        <label for="password">Şifre</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="••••••••"
          [class.invalid]="form.get('password')?.invalid && form.get('password')?.touched"
        />
        @if (form.get('password')?.invalid && form.get('password')?.touched) {
          <span class="field-error">Şifre zorunludur.</span>
        }
      </div>

      @if (errorMessage) {
        <div class="error-banner">{{ errorMessage }}</div>
      }

      <button type="submit" class="btn-primary" [disabled]="loading">
        {{ loading ? 'Giriş Yapılıyor...' : 'Giriş Yap' }}
      </button>
    </form>

    <p class="auth-footer">
      Hesabın yok mu? <a routerLink="/register">Kayıt ol</a>
    </p>
  </div>
</div>
