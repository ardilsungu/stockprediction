version: '3.8'

services:
  db:
    image: postgres:16
    container_name: stockprediction_db
    environment:
      POSTGRES_DB: stockprediction_db
      POSTGRES_USER: stockuser
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: stockprediction_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
